services:
  postgres:
    container_name: ct-postgres
    image: 'postgres:18'
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=cliqtracker
    volumes:
      - ct-postgres-data:/var/lib/postgresql

  redis:
    container_name: ct-redis
    image: 'redis:8'
    ports:
      - 6379:6379

  api:
    container_name: ct-api
    image: cliqtracker-api
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/cliqtracker
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env


  worker:
    container_name: ct-worker
    depends_on:
      - postgres
      - redis
    build: .
    command: arq app.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql+asyncpg://root:root@postgres:5432/cliqtracker
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env


volumes:
  ct-postgres-data:
